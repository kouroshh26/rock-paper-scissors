<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- =========================
         MAIN MENU
    ========================== -->

    <div id="main-menu">

        <h1>Rock Paper Scissors</h1>

        <button onclick="startGame()">
            Start Game
        </button>

        <button onclick="continueGame()">
            Continue Game
        </button>

        <button onclick="showHistory()">
            Game History
        </button>

        <button onclick="exitGame()">
            Exit
        </button>

    </div>


    <!-- =========================
         GAME SCREEN
    ========================== -->

    <div id="game-screen" style="display: none;">

        <h2>Rock Paper Scissors</h2>


        <!-- SCORE -->

        <div class="score-board">

            <div>
                <h3>You</h3>
                <p id="user-score">0</p>
            </div>

            <div>
                <h3>Computer</h3>
                <p id="computer-score">0</p>
            </div>

        </div>


        <!-- CHOICE BUTTONS -->

        <div id="choice-buttons" class="choices">

            <button onclick="playGame('rock')">

                <img
                    src="{{ url_for('static', filename='images/images (4).png') }}"
                    alt="Rock"
                >

            </button>


            <button onclick="playGame('paper')">

                <img
                    src="{{ url_for('static', filename='images/images (3).png') }}"
                    alt="Paper"
                >

            </button>


            <button onclick="playGame('scissors')">

                <img
                    src="{{ url_for('static', filename='images/images (2).png') }}"
                    alt="Scissors"
                >

            </button>

        </div>


        <!-- GAME RESULT -->

        <div class="game-result">

            <p>
                Your choice:
                <span id="user-choice"></span>
            </p>

            <p>
                Computer choice:
                <span id="computer-choice"></span>
            </p>

            <p id="result"></p>

            <h2 id="winner-message"></h2>

        </div>


        <!-- GAME ACTIONS -->

        <div class="game-actions">

            <button onclick="saveGame()">
                Save Game
            </button>

            <button onclick="exitGame()">
                Exit
            </button>

        </div>

    </div>


    <!-- =========================
         HISTORY SCREEN
    ========================== -->

    <div id="history-screen" style="display: none;">

        <h2>Game History</h2>


        <div id="history-list"></div>


        <button onclick="deleteAllHistory()">
            Delete All
        </button>


        <button onclick="backToMenu()">
            Back
        </button>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="{{ url_for('static', filename='game.js') }}"></script>

</body>

</html>
